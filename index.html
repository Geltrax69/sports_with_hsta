<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ═══ Favicon / Browser Tab Icon ═══ -->
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%assets/images/logo.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%assets/images/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%assets/images/logo.png" />
  <link rel="shortcut icon" href="%BASE_URL%assets/images/logo.png" />

  <!-- ═══ Primary SEO Meta Tags ═══ -->
  <title>Haryana Sepak Takraw Association</title>
  <meta name="title" content="Haryana Sepak Takraw Association" />
  <meta name="description" content="The official governing body for Sepak Takraw in Haryana. Recognised by Ministry of Youth Affairs and Sports, affiliated with Sepaktakraw Federation of India." />
  <meta name="keywords" content="Haryana Sepak Takraw, HSTA, Sepak Takraw India, Sepaktakraw, Sports Haryana, Federation" />
  <meta name="author" content="Haryana Sepak Takraw Association" />
  <meta name="robots" content="index, follow" />

  <!-- ═══ Open Graph / Facebook / WhatsApp ═══ -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.hsta.in/" />
  <meta property="og:title" content="Haryana Sepak Takraw Association" />
  <meta property="og:description" content="The official governing body for Sepak Takraw in Haryana. Recognised by Ministry of Youth Affairs and Sports, affiliated with Sepaktakraw Federation of India." />
  <meta property="og:image" content="https://www.hsta.in/assets/images/logo.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:alt" content="Haryana Sepak Takraw Association Logo" />
  <meta property="og:site_name" content="Haryana Sepak Takraw Association" />
  <meta property="og:locale" content="en_IN" />

  <!-- ═══ Twitter / X Card ═══ -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:url" content="https://www.hsta.in/" />
  <meta name="twitter:title" content="Haryana Sepak Takraw Association" />
  <meta name="twitter:description" content="The official governing body for Sepak Takraw in Haryana. Recognised by Ministry of Youth Affairs and Sports." />
  <meta name="twitter:image" content="https://www.hsta.in/assets/images/logo.png" />
  <meta name="twitter:image:alt" content="Haryana Sepak Takraw Association Logo" />

  <!-- ═══ WhatsApp specific (uses OG tags above + these) ═══ -->
  <meta property="og:image:type" content="image/png" />

  <link rel="preload" href="%BASE_URL%fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
  <link href="%BASE_URL%assets/css/styles.css" rel="stylesheet" />

  <!-- Tailwind is processed via Vite plugin; CDN removed for production safety. -->

</head>

<body>
  <div id="root"></div>
  <script>
    // Restore SPA route after GitHub Pages 404 redirect (public/404.html).
    (function () {
      var params = new URLSearchParams(window.location.search);
      var p = params.get('p');
      if (!p) return;

      try {
        var target = decodeURIComponent(p);
        history.replaceState(null, '', target);
      } catch (e) {
        history.replaceState(null, '', '/');
      }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
