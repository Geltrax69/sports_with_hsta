<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Site CSS (copied from repo into /public/assets) -->
  <link href="%BASE_URL%assets/css/styles.css" rel="stylesheet" />

  <!-- Tailwind is processed via Vite plugin; CDN removed for production safety. -->

  <title>Haryana Sepak Takraw Association</title>
</head>

<body>
  <div id="root"></div>
  <script>
    // Restore SPA route after GitHub Pages 404 redirect (public/404.html).
    (function () {
      var params = new URLSearchParams(window.location.search);
      var p = params.get('p');
      if (!p) return;

      try {
        var target = decodeURIComponent(p);
        history.replaceState(null, '', target);
      } catch (e) {
        history.replaceState(null, '', '/');
      }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
