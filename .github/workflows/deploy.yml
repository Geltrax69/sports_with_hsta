name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react/package-lock.json
      - name: Set npm config for reliable installs
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 600000
          npm config set network-timeout 600000
          npm config set network-concurrency 1
          npm config set prefer-offline true
          npm config set progress false
          npm config set audit false
          npm config set fund false
          npm config set registry https://registry.npmjs.org/
      - name: Install dependencies with retry and fallback
        working-directory: react
        run: |
          set -e
          echo "Installing deps with npm ci (up to 3 attempts)..."
          attempts=0
          until [ $attempts -ge 3 ]
          do
            attempts=$((attempts+1))
            echo "Attempt $attempts"
            if npm ci; then
              echo "npm ci succeeded"
              break
            fi
            echo "npm ci failed (attempt $attempts). Waiting before retry..."
            sleep $((attempts*20))
          done
          if [ $attempts -ge 3 ]; then
            echo "Falling back to npm install"
            npm install --no-audit --no-fund --progress=false --prefer-offline
          fi
      - name: Fallback to Node 18 if install still fails
        if: failure()
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: react/package-lock.json
      - name: Retry install on Node 18
        if: failure()
        working-directory: react
        run: |
          set -e
          npm ci || npm install --no-audit --no-fund --progress=false --prefer-offline
      - name: Build
        working-directory: react
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'react/dist'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
